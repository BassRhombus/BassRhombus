name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BassRhombus
          outputs: |
            dist/snake.svg?color_snake=#2bc56b&color_dots=#e5e7eb,#9fbef0,#3b7de6,#0a51c2,#083d94
            dist/snake-dark.svg?color_snake=#2bc56b&color_dots=#25262B,#083d94,#0a51c2,#18a099,#2bc56b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
