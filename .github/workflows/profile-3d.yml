name: Generate 3D Contribution City

on:
  schedule:
    - cron: "15 */12 * * *"
  push:
    branches: [main]
    paths:
      - "assets/3d-settings.json"
      - ".github/workflows/profile-3d.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  city:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: BassRhombus
          SETTING_JSON: assets/3d-settings.json

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh 3D contribution city"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep $((i * 5)); done
          exit 1
