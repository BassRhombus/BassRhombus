<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Contribution streak"><title>Contribution streak</title><style>
  text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .h { font-family: Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; fill: #E5E7EB; }
  .muted { fill: #9CA3AF; }
  .fade-in { animation: fadeIn 0.3s ease-in-out both; }
  .slide-up { animation: slideUp 0.4s ease-out both; }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style><defs><pattern id="streak-grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M0 0.5H60M0.5 0V60" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" fill="none"/></pattern><radialGradient id="streak-g1"><stop offset="0" stop-color="rgb(10,81,194)" stop-opacity="0.12"/><stop offset="1" stop-color="rgb(10,81,194)" stop-opacity="0"/></radialGradient><radialGradient id="streak-g2"><stop offset="0" stop-color="rgb(43,197,107)" stop-opacity="0.08"/><stop offset="1" stop-color="rgb(43,197,107)" stop-opacity="0"/></radialGradient><radialGradient id="streak-g3"><stop offset="0" stop-color="rgb(24,160,153)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(24,160,153)" stop-opacity="0"/></radialGradient><clipPath id="streak-clip"><rect width="495" height="210" rx="12"/></clipPath></defs><g clip-path="url(#streak-clip)"><rect width="495" height="210" fill="#1A1A1E"/><rect width="495" height="210" fill="url(#streak-grid)"/><ellipse cx="74.2" cy="0.0" rx="1000" ry="600" fill="url(#streak-g1)"/><ellipse cx="420.8" cy="0.0" rx="800" ry="500" fill="url(#streak-g2)"/><ellipse cx="247.5" cy="210.0" rx="600" ry="400" fill="url(#streak-g3)"/></g><rect x="0.5" y="0.5" width="494" height="209" rx="12" fill="none" stroke="#374151"/><g class="slide-up" style="animation-delay:0.10s"><text x="82" y="96" text-anchor="middle" class="h" font-size="28" style="fill:#3b7de6">1,978</text><text x="82" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#E5E7EB">Total Contributions</text><text x="82" y="174" text-anchor="middle" font-size="11.5" class="muted">Nov 20, 2024 – Present</text></g><path d="M165 40V170" stroke="#374151"/><circle cx="247" cy="86" r="40" fill="none" stroke="#4ed88a" stroke-width="5" class="fade-in" style="animation-delay:0.25s"/><rect x="234" y="36" width="26" height="16" fill="#1A1A1E"/><path class="pulse-slow" transform="translate(238,26)" d="M9 0C11 6 18 8 18 14a9 9 0 0 1-18 0c0-4 3-6 4-9 1 3 3 4 3 4 0-4 1-6 2-9z" fill="#F59E0B"/><g class="slide-up" style="animation-delay:0.25s"><text x="247" y="96" text-anchor="middle" class="h" font-size="28" style="fill:#4ed88a">0</text><text x="247" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#E5E7EB">Current Streak</text><text x="247" y="174" text-anchor="middle" font-size="11.5" class="muted">Start one today</text></g><path d="M330 40V170" stroke="#374151"/><g class="slide-up" style="animation-delay:0.40s"><text x="412" y="96" text-anchor="middle" class="h" font-size="28" style="fill:#1fc2b9">18</text><text x="412" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#E5E7EB">Longest Streak</text><text x="412" y="174" text-anchor="middle" font-size="11.5" class="muted">Mar 31 – Apr 17</text></g></svg>
