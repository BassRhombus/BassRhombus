<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="GitHub stats"><title>GitHub stats</title><style>
  text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .h { font-family: Poppins, Inter, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; fill: #E5E7EB; }
  .muted { fill: #9CA3AF; }
  .fade-in { animation: fadeIn 0.3s ease-in-out both; }
  .slide-up { animation: slideUp 0.4s ease-out both; }
  @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
  .ring { animation: ring 1.2s ease-out both; }
  @keyframes ring { from { stroke-dasharray: 0 314.2; } }</style><defs><pattern id="stats-grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M0 0.5H60M0.5 0V60" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" fill="none"/></pattern><radialGradient id="stats-g1"><stop offset="0" stop-color="rgb(10,81,194)" stop-opacity="0.12"/><stop offset="1" stop-color="rgb(10,81,194)" stop-opacity="0"/></radialGradient><radialGradient id="stats-g2"><stop offset="0" stop-color="rgb(43,197,107)" stop-opacity="0.08"/><stop offset="1" stop-color="rgb(43,197,107)" stop-opacity="0"/></radialGradient><radialGradient id="stats-g3"><stop offset="0" stop-color="rgb(24,160,153)" stop-opacity="0.06"/><stop offset="1" stop-color="rgb(24,160,153)" stop-opacity="0"/></radialGradient><clipPath id="stats-clip"><rect width="495" height="210" rx="12"/></clipPath></defs><g clip-path="url(#stats-clip)"><rect width="495" height="210" fill="#1A1A1E"/><rect width="495" height="210" fill="url(#stats-grid)"/><ellipse cx="74.2" cy="0.0" rx="1000" ry="600" fill="url(#stats-g1)"/><ellipse cx="420.8" cy="0.0" rx="800" ry="500" fill="url(#stats-g2)"/><ellipse cx="247.5" cy="210.0" rx="600" ry="400" fill="url(#stats-g3)"/></g><rect x="0.5" y="0.5" width="494" height="209" rx="12" fill="none" stroke="#374151"/><rect x="25" y="16" width="4" height="26" rx="2" fill="#3b7de6"/><text x="39" y="36" class="h" font-size="17">BassRhombus&#x27;s GitHub Stats</text><g class="slide-up" style="animation-delay:0.10s"><circle cx="34" cy="66" r="4" fill="#F59E0B"/><text x="48" y="70" font-size="13.5" fill="#E5E7EB" font-weight="500">Total Stars Earned:</text><text x="290" y="70" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">1</text></g><g class="slide-up" style="animation-delay:0.18s"><circle cx="34" cy="89" r="4" fill="#3b7de6"/><text x="48" y="93" font-size="13.5" fill="#E5E7EB" font-weight="500">Commits (2026):</text><text x="290" y="93" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">1,160</text></g><g class="slide-up" style="animation-delay:0.26s"><circle cx="34" cy="112" r="4" fill="#1fc2b9"/><text x="48" y="116" font-size="13.5" fill="#E5E7EB" font-weight="500">Commits (all time):</text><text x="290" y="116" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">2,977</text></g><g class="slide-up" style="animation-delay:0.34s"><circle cx="34" cy="135" r="4" fill="#4ed88a"/><text x="48" y="139" font-size="13.5" fill="#E5E7EB" font-weight="500">Pull Requests:</text><text x="290" y="139" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">7</text></g><g class="slide-up" style="animation-delay:0.42s"><circle cx="34" cy="158" r="4" fill="#06B6D4"/><text x="48" y="162" font-size="13.5" fill="#E5E7EB" font-weight="500">Issues:</text><text x="290" y="162" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">0</text></g><g class="slide-up" style="animation-delay:0.50s"><circle cx="34" cy="181" r="4" fill="#9CA3AF"/><text x="48" y="185" font-size="13.5" fill="#E5E7EB" font-weight="500">Contributed to:</text><text x="290" y="185" font-size="13.5" fill="#E5E7EB" font-weight="700" text-anchor="end">2</text></g><defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7de6"/><stop offset="1" stop-color="#4ed88a"/></linearGradient></defs><circle cx="400" cy="118" r="50" fill="none" stroke="#2C2E33" stroke-width="7"/><circle cx="400" cy="118" r="50" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="62.6 314.2" transform="rotate(-90 400 118)" class="ring"/><text x="400" y="128" text-anchor="middle" class="h" font-size="30">C+</text><text x="400" y="194" text-anchor="middle" font-size="11" class="muted">Top 80.1%</text></svg>
